<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}} 投稿規則｜頂會投稿速查手冊</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<header class="site">
  <a class="brand" href="../index.html">頂會投稿速查手冊</a>
  <nav>{{nav}}</nav>
</header>
<main>
  <p class="crumb"><a href="../index.html">首頁</a> / {{name}}</p>
  <h1>{{name}}</h1>
  <p class="full-name">{{full_name}}　·　{{edition}}</p>
  <p class="summary">{{summary}}</p>
  <nav class="toc">{{toc}}</nav>
  {{sections}}
  <section id="sources">
    <h2>官方來源</h2>
    <ul class="sources">{{sources}}</ul>
  </section>
</main>
<footer class="site">
  <p>本頁每一條規定都附官方原文，由 <code>build.py</code> 自動對照 <code>sources/</code> 檢查。規定可能隨時更新，投稿前請以官網最新公告為準。</p>
</footer>
</body>
</html>
