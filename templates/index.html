<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>頂會投稿速查手冊</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site">
  <a class="brand" href="index.html">頂會投稿速查手冊</a>
  <nav>{{nav}}</nav>
</header>
<main>
  <h1>頂會投稿速查手冊</h1>
  <p class="summary">整理 {{count}} 個 AI 頂會的投稿規則：頁數、匿名、附錄、LLM 使用規定和 rebuttal。每一條都附官方原文和出處，點開「官方原文」就能自己核對。</p>

  <h2>會議一覽</h2>
  <div class="cards">{{cards}}</div>

  <h2>快速比較</h2>
  <p class="note">每格是該會議頁面中，該段落的第一條重點。細節和原文請點會議名稱。</p>
  <div class="table-wrap">
    <table class="compare">
      <thead><tr><th scope="col">項目</th>{{head}}</tr></thead>
      <tbody>{{rows}}</tbody>
    </table>
  </div>
</main>
<footer class="site">
  <p>資料來源：各會議官網的徵稿說明與作者指南（2026/11/02 擷取）。規定可能隨時更新，投稿前請以官網最新公告為準。</p>
</footer>
</body>
</html>
